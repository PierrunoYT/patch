[package]
name = "sandbox-helper"
version = "0.1.0"
edition = "2021"
description = "Runs one command in a Windows AppContainer for Patch"
license = "Apache-2.0"
publish = false

[[bin]]
name = "file-helper"
path = "src/file_helper.rs"

[[bin]]
name = "net-bridge"
path = "src/net_bridge.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_IO",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
