# Models used only by tests/application-model-switch.test.ts. They exist to give
# the switch tests two models that disagree on edit format, repository-map policy,
# and image support; the bundled catalog agrees on all three.
- name: test/whole-model
  provider: openai
  editFormat: whole
  useRepoMap: false
  capabilities:
    streaming: true
    systemRole: true
    images: false

- name: test/diff-model
  provider: openai
  editFormat: diff
  editorModel: test/editor-model
  editorEditFormat: diff
  inputCostPerMillion: 1
  outputCostPerMillion: 1
  useRepoMap: true
  capabilities:
    streaming: true
    systemRole: true
    images: true

- name: test/editor-model
  provider: openai
  editFormat: diff
  useRepoMap: true
  inputCostPerMillion: 1
  outputCostPerMillion: 1
  capabilities:
    streaming: true
    systemRole: true

# A history budget small enough that one exchange overflows it, so the
# summarization path is reachable without a wall of fixture text.
- name: test/summarizing-model
  provider: openai
  editFormat: whole
  useRepoMap: false
  maxChatHistoryTokens: 5
  weakModel: test/weak-model
  inputCostPerMillion: 1
  outputCostPerMillion: 1
  capabilities:
    streaming: true
    systemRole: true

# Priced so a test can see whether summarization's own tokens are accounted for.
- name: test/weak-model
  provider: openai
  editFormat: whole
  useRepoMap: false
  inputCostPerMillion: 1
  outputCostPerMillion: 1
  capabilities:
    streaming: true
    systemRole: true

# An editor edit format the editor role has no prompts for, so the architect can
# be shown refusing it before it requests a plan.
- name: test/unsupported-editor-model
  provider: openai
  editFormat: diff
  editorModel: test/editor-model
  editorEditFormat: udiff
  useRepoMap: false
  capabilities:
    streaming: true
    systemRole: true
