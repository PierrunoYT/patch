name: Release

# Push a tag such as v0.1.0 to build the installers and attach them to a GitHub release. Linux and macOS packages
# are experimental until they have been tested by hand (see the GitHub issue for that); the Windows installer is
# the supported release.
#
# Every other run is a dry run: started by hand, or by a change to this workflow or package.json (which holds the
# packaging config). It runs the same tests and builds the same installers, uploaded as run artifacts, but the Windows
# installer is unsigned, the tag check is skipped and nothing is released.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', 'package.json']
  pull_request:
    paths: ['.github/workflows/release.yml', 'package.json']
  workflow_dispatch:

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

# Build jobs run third-party install scripts, so they only get a read token. The release job is the one that writes.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Windows installer is the supported release and must be signed, so its leg stops before installing anything
      # when the signing secrets are missing.
      - name: Require signing credentials
        if: runner.os == 'Windows' && env.IS_RELEASE == 'true'
        shell: bash
        run: |
          if [ -z "$WIN_CSC_LINK" ] || [ -z "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "::error::Releases require WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD repository secrets. Unsigned releases are disabled."
            exit 1
          fi
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # node-pty compiles from source on Linux and needs a compiler and Python.
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: npm ci

      # npm 11 skips install scripts unless allowed in package.json; make sure the Electron binary is there.
      - run: node node_modules/electron/install.js

      - name: Check the tag matches the package version
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # The Windows installer ships sandbox-helper.exe (the AppContainer command sandbox), which electron-builder copies
      # from this build output.
      - name: Build the Windows sandbox helper
        if: runner.os == 'Windows'
        run: cargo build --release --locked --manifest-path native/sandbox-helper/Cargo.toml

      - run: npm run typecheck
      - run: npm run test:unit

      # Ubuntu does not let Chromium use its namespace sandbox, so it needs the setuid helper, set up as the deb
      # package does. Without it a plain `electron .` start aborts (the single-instance test starts one).
      - name: Set up Electron's sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # test:e2e also builds out/, which the installers package. A failing Linux or macOS leg only drops its own
      # packages from the release (see the release job).
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      # Electron needs a display on Linux.
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      # The Linux prebuild does not exist, and a binary compiled for Node would not load in Electron.
      - name: Rebuild node-pty for Electron
        if: runner.os == 'Linux'
        run: npx @electron/rebuild -f -w node-pty

      # Local builds may be unsigned, but a Windows release must never silently fall back to an unsigned artifact.
      - name: Build the Windows installer
        if: runner.os == 'Windows' && env.IS_RELEASE == 'true'
        run: npx electron-builder --win --publish never --config.forceCodeSigning=true
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # A dry run proves the installer builds; it gets no signing secrets, so it cannot be mistaken for a release.
      - name: Build the unsigned Windows installer (dry run)
        if: runner.os == 'Windows' && env.IS_RELEASE != 'true'
        run: npx electron-builder --win --publish never

      - name: Verify release signatures
        if: runner.os == 'Windows' && env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          foreach ($path in @('dist/win-unpacked/Patch.exe', 'dist/Patch-Installer.exe')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path -ErrorAction Stop
            if ($signature.Status -ne 'Valid') {
              throw "Invalid release signature on ${path}: $($signature.Status)"
            }
            Write-Output "Verified release signature: $path"
          }

      # Builds this platform's targets from package.json without publishing. The release job publishes.
      - name: Build the Linux and macOS packages
        if: runner.os != 'Windows'
        run: npx electron-builder --publish never

      - name: The Linux package contains the Electron node-pty binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unpacked=$(find dist -type d -name 'linux-unpacked' | head -1)
          test -n "$unpacked"
          node_file=$(find "$unpacked" -path '*node-pty*pty.node' | head -1)
          test -n "$node_file"
          echo "packaged pty: $node_file"

      - name: Upload the installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  # Runs even when a build leg failed, so an experimental Linux or macOS failure cannot hold back the supported Windows
  # installer. The release still requires the Windows installer (checked below) and is skipped if the run is cancelled
  # or is a dry run.
  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The tag check already ran on every build leg, which this job requires. It is repeated here so a future change
      # that stops requiring every leg cannot publish notes for a tag that does not match package.json.
      - name: Check the tag matches the package version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      # Only the Windows leg uploads an .exe, and it uploads only after its tests passed and both signatures verified.
      # Without it there is no release; missing Linux or macOS packages are named in the release notes instead.
      - name: Require the signed Windows installer
        shell: bash
        run: |
          if [ ! -f dist/Patch-Installer.exe ]; then
            echo "::error::The Windows build failed, so there is no installer to release."
            exit 1
          fi
          missing=()
          for pattern in '*.AppImage' '*.deb' '*.dmg'; do
            compgen -G "dist/$pattern" > /dev/null || missing+=("$pattern")
          done
          echo "MISSING_PACKAGES=${missing[*]}" >> "$GITHUB_ENV"

      # A checksum file, attached to the release, so a download can be verified.
      - name: Write the checksums
        shell: bash
        run: |
          shopt -s nullglob
          (cd dist && sha256sum *.exe *.dmg *.AppImage *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # Release notes: this version's section of CHANGELOG.md plus a link to the full file at this tag. The Linux and
      # macOS packages are attached but called out as untested, so a release does not imply they are supported.
      - name: Write the release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tr -d '\r' < CHANGELOG.md | awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for version $version in CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "---"
            echo "SHA-256 of \`Patch-Installer.exe\`: \`$(grep ' Patch-Installer.exe$' dist/SHA256SUMS.txt | cut -d' ' -f1)\` (every file's checksum is in \`SHA256SUMS.txt\`)."
            echo "The Windows installer and app are code-signed; both Authenticode signatures were verified before publishing."
            echo
            echo "The Windows installer is the supported download. The Linux AppImage and deb, and the macOS DMG, are experimental: they are built by CI but have not been tested by hand. The macOS app is not code-signed, so macOS may report it as damaged after download; after copying it to Applications, \`xattr -cr /Applications/Patch.app\` clears the quarantine flag. Whether the unsigned app then launches has not been checked yet (#22)."
            if [ -n "$MISSING_PACKAGES" ]; then
              echo
              echo "Not included in this release because their build failed: $MISSING_PACKAGES."
            fi
            echo
            echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
          } >> release-notes.md

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --notes-file release-notes.md
