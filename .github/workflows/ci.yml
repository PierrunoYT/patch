name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test packed executable
        run: npm run smoke:package

  pty:
    name: Explicit PTY dependency (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install portable dependencies
        run: npm ci

      - name: Provision native PTY dependency
        run: npm install --no-save --no-package-lock node-pty@1.1.0

      - name: Run provisioned PTY contract
        env:
          PATCH_TEST_PTY: "1"
        run: npm test -- tests/pty.test.ts tests/pty-provisioned.test.ts

  platform:
    name: Package and platform contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run platform-sensitive contracts
        run: npm test -- tests/safe-path.test.ts tests/filesystem.test.ts tests/git-repository.test.ts tests/git-worktree-platform.test.ts tests/model-command.test.ts tests/history.test.ts tests/input-editing.test.ts tests/integrations.test.ts tests/cli.test.ts

      - name: Build package
        run: npm run build

      - name: Test packed bin and repository-map languages
        run: npm run smoke:package
