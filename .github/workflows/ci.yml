name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm audit --omit=dev --audit-level=high

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm 11 skips install scripts unless allowed in package.json; make sure the Electron binary is there.
      - run: node node_modules/electron/install.js

      # Ubuntu does not let Chromium use its namespace sandbox, so it needs the setuid helper, set up as the deb
      # package does. Without it a plain `electron .` start aborts (the single-instance test starts one).
      - name: Set up Electron's sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # The Windows command sandbox: the unit tests also run real commands through it when the helper exists.
      - name: Build the Windows sandbox helper
        if: runner.os == 'Windows'
        run: cargo build --release --locked --bins --examples --manifest-path native/sandbox-helper/Cargo.toml

      # File operations use native handles on every platform; run their regressions on native hosts.
      - name: Test native file operations and sandbox helper
        run: cargo test --locked --all-targets --manifest-path native/sandbox-helper/Cargo.toml

      # Older Server images lack the null-device package ACE that newer Windows installs at boot.
      # This preserves existing ACLs and grants only NUL access on this disposable hosted runner.
      - name: Prepare the Windows CI null device for AppContainers
        if: runner.os == 'Windows'
        run: .\native\sandbox-helper\target\release\examples\prepare_ci_null.exe --apply-ci

      - name: Install Linux command sandbox test backends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apparmor bubblewrap

          # Ubuntu restricts unprivileged user namespaces through AppArmor. Grant only bwrap the userns permission
          # it needs rather than disabling that system-wide protection.
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,

            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

          echo "AppArmor userns restriction: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unavailable)"
          sudo apparmor_status | grep -E 'apparmor module|bwrap' || true
          bwrap --version
          bwrap --unshare-all --ro-bind / / true
          docker pull node:lts

      - run: npm run typecheck
      - name: Check Windows sandbox startup and recovery
        if: runner.os == 'Windows'
        run: npx vitest run --project unit src/main/tools/sandbox_windows.integration.test.ts -t "starts PowerShell|keeps metadata protected"
      - run: npm run test:unit
        env:
          PATCH_REQUIRE_NATIVE_SANDBOX: '1'

      - if: runner.os != 'Linux'
        run: npm run test:e2e

      # Electron needs a display on Linux.
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

  # Proves the installers for the other platforms actually build, including a node-pty binary compiled for Electron
  # on Linux (it ships no Linux prebuild). These builds are not hand-tested; see the experimental note in the docs.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: --linux
          - os: macos-latest
            flags: --mac --universal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # node-pty compiles from source on Linux and needs a compiler and Python.
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: npm ci

      - run: node node_modules/electron/install.js

      # The Linux prebuild does not exist, and a binary compiled for Node would not load in Electron. Build it for
      # Electron's ABI. Windows and macOS keep node-pty's own prebuilds, which match Electron's ABI.
      - name: Rebuild node-pty for Electron
        if: runner.os == 'Linux'
        run: npx @electron/rebuild -f -w node-pty

      - name: node-pty has a native binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -f node_modules/node-pty/build/Release/pty.node
          else
            test -f "node_modules/node-pty/prebuilds/$(node -p process.platform)-$(node -p process.arch)/pty.node"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper
            test -x node_modules/node-pty/prebuilds/darwin-x64/spawn-helper
          fi

      - run: npm run build

      - name: Build the installers
        run: npx electron-builder ${{ matrix.flags }} --publish never

      - name: The Linux package contains the Electron node-pty binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unpacked=$(find dist -type d -name 'linux-unpacked' | head -1)
          test -n "$unpacked"
          node_file=$(find "$unpacked" -path '*node-pty*pty.node' | head -1)
          test -n "$node_file"
          echo "packaged pty: $node_file"

      # Install the deb the way a user would (its install script sets up the sandbox helper and AppArmor profile),
      # then start the installed app and use it: open a project and run a command in the terminal.
      - name: Smoke-test the installed deb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a node scripts/smoke-packaged.mjs /opt/Patch/patch-app

      # Informational for now: an AppImage cannot carry the setuid sandbox helper.
      - name: Smoke-test the AppImage
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          appimage=$(ls dist/*.AppImage | head -1)
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null)
          xvfb-run -a node scripts/smoke-packaged.mjs "$RUNNER_TEMP/squashfs-root/AppRun"

      # Start the app from the DMG, as a user's first launch would, and use it the same way.
      - name: Smoke-test the DMG
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/patch-dmg"
          node scripts/smoke-packaged.mjs "$RUNNER_TEMP/patch-dmg/Patch.app/Contents/MacOS/Patch"
          # A helper the app started (such as the crash reporter) can still hold the volume for a moment.
          hdiutil detach -force "$RUNNER_TEMP/patch-dmg"

      - name: Upload the installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
